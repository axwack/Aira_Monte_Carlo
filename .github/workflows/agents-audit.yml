name: Agent Verification Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UI/UX Governance — ESLint
        run: npm run audit:ui

      - name: Retirement Math — Invariant Tests
        run: npm run audit:math

      - name: Verify Build & UI Bundling
        run: npm run build
        env:
          CI: false
