<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<!--
      manifest.json provides metadata used when your web app is added to the

	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
	<!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
     <!-- SEO -->
    <meta name="description" content="AiRA Freedom Financial – Advanced retirement calculator with Monte Carlo simulation, Guyton‑Klinger guardrails, and net worth projection." />
    <meta name="keywords" content="retirement calculator, Monte Carlo, financial planning, FIRE, Roth conversion, mortgage payoff" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.tiredtoretire.com" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="AiRA Freedom Financial – Smart Retirement Planning" />
    <meta property="og:description" content="Stress‑test your retirement with 3,000 market scenarios. Free, open‑source, and built for real life." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tiredtoretire.com/" />
    <meta property="og:image" content="https://YOUR_DOMAIN.com/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AiRA Freedom Financial" />
    <meta name="twitter:description" content="Retirement planning with Monte Carlo and guardrails." />
    <meta name="twitter:image" content="https://YOUR_DOMAIN.com/og-image.png" />
    
    <!-- Google Analytics (optional) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

	<title>AiRA Freedom Financial</title>
</head>

<body>
	<noscript>
		You need to enable JavaScript to run this app.
	</noscript>
  <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js'
    data-cf-beacon='{"token": "1204c61ce22e4d45a78835f0fecf48bd"}'></script><!-- End Cloudflare Web Analytics -->
	<div id="root"></div>
	<!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

	<!-- ── TEMPORARY PREVIEW ONLY (branch design/home-s1-preview) ───────────────
	     Repositions the already-rendered Home screen into the Structure 1
	     composition at runtime. This is a viewing device, not a build: React may
	     re-render and undo it, and moved nodes can lose their handlers.
	     Delete this block to restore the app exactly as it is. No application
	     code is changed by it. -->
	<script>
	(function () {
	  var tries = 0;
	  var timer = setInterval(function () {
	    tries++;
	    var layout = document.querySelector('.layout');
	    var main = document.querySelector('main.main');
	    var met = main && main.querySelector(':scope > .met');
	    var chart = document.querySelector('.chart-card');
	    if (!layout || !main || !met || !chart) {
	      if (tries > 80) { clearInterval(timer); console.warn('[s1-preview] containers not found'); }
	      return;
	    }
	    clearInterval(timer);
	    try {
	      /* 1. collapse the input column to a 56px rail */
	      layout.style.gridTemplateColumns = '56px 1fr';
	      var side = layout.firstElementChild;
	      if (side && side !== main) {
	        side.style.width = '56px';
	        side.style.minWidth = '0';
	        side.style.overflow = 'hidden';
	        Array.prototype.forEach.call(side.children, function (c) { c.style.display = 'none'; });
	        var label = document.createElement('div');
	        label.textContent = 'CONFIGURE PLAN';
	        label.style.cssText = 'writing-mode:vertical-rl;transform:rotate(180deg);font:9.5px/1 ui-monospace,monospace;letter-spacing:.12em;color:#8793a7;padding:16px 0;text-align:center;white-space:nowrap';
	        side.appendChild(label);
	      }

	      /* 2. hero row: the answer block and the chart side by side */
	      var hero = document.createElement('div');
	      hero.setAttribute('data-s1-preview', 'hero');
	      hero.style.cssText = 'display:grid;gap:26px;align-items:center;padding:16px 0 20px;border-bottom:1px solid #243040';
	      main.style.display = 'block';
	      main.insertBefore(hero, main.firstElementChild);
	      hero.appendChild(met);
	      hero.appendChild(chart);

	      /* 3. chart sizing */
	      chart.style.padding = '12px';
	      chart.style.height = 'auto';

	      /* 4. responsive */
	      var mq = window.matchMedia('(max-width: 1000px)');
	      var mqTiny = window.matchMedia('(max-width: 700px)');
	      function apply() {
	        var narrow = mq.matches;
	        var tiny = mqTiny.matches;
	        hero.style.gridTemplateColumns = narrow ? '1fr' : '1fr 460px';
	        chart.style.width = narrow ? '100%' : '460px';
	        layout.style.gridTemplateColumns = tiny ? '1fr' : '56px 1fr';
	        if (side && side !== main) side.style.display = tiny ? 'none' : '';
	      }
	      apply();
	      if (mq.addEventListener) mq.addEventListener('change', apply);
	      if (mqTiny.addEventListener) mqTiny.addEventListener('change', apply);

	      /* 5. tabs scroll on narrow screens */
	      var tabs = document.querySelector('nav.tabs');
	      if (tabs) { tabs.style.overflowX = 'auto'; tabs.style.whiteSpace = 'nowrap'; }
	    } catch (e) {
	      console.warn('[s1-preview]', e);
	    }
	  }, 250);
	})();
	</script>
</body>

</html>
